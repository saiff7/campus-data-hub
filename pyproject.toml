[project]
name = "campus-data-hub"
version = "0.1.0"
description = "Synthetic higher-education data operations platform: source simulators, integration, reconciliation and compliance reporting on SQL Server."
readme = "README.md"
license = "MIT"
authors = [{ name = "Mohammed Abdul Saif" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyodbc>=5.3,<6",
    "pydantic-settings>=2.15,<3",
]

[project.scripts]
campus-ops = "campus_ops.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "ruff>=0.16,<0.17",
    "sqlfluff>=4.4,<5",
    "pre-commit>=4.6,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipelines/campus_ops"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-ra --strict-markers"
markers = [
    "db: requires a deployed SQL Server (set CAMPUS_RUN_DB_TESTS=1)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["pipelines", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PL", "PT"]
ignore = [
    "PLR0913",  # generator builders legitimately take several related collections
]

[tool.ruff.lint.per-file-ignores]
# assert is the pytest idiom; magic values are expected fixture constants.
"tests/**" = ["S101", "PLR2004"]
# random.Random is used for reproducible synthetic data, not for security. Probability
# literals in comparisons are the simulation's distribution parameters and read best inline.
"pipelines/campus_ops/generators/**" = ["S311", "PLR2004"]

[tool.ruff.format]
quote-style = "double"
