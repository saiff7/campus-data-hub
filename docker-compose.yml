name: campus-data-hub

services:
  sqlserver:
    # The official image is amd64-only; Apple Silicon runs it through Rosetta emulation.
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: campus-data-hub-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
      MSSQL_AGENT_ENABLED: "true"
      TZ: Etc/UTC
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -Q "SET NOCOUNT ON; SELECT 1" > /dev/null
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped

volumes:
  mssql-data:
